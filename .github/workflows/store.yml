name: Store submission

# Runs automatically after a successful Release, and can also be dispatched by hand.
#
# The Release workflow hands off to this one with `gh workflow run` rather than this workflow
# carrying an `on: release` trigger. That is not a style choice: the release is created with
# GITHUB_TOKEN, and events raised by GITHUB_TOKEN do not start new workflow runs, so an
# `on: release` trigger here would look correct and never fire. workflow_dispatch is one of the
# two documented exceptions.
#
# Still worth knowing before changing anything here: once a submission is created through the API
# it must NOT be edited in Partner Center, or the API can no longer commit it. So pick one path
# per release, this workflow or a manual upload, never both. Set the STORE_AUTO_SUBMIT repository
# variable to `false` to go back to manual uploads without editing any YAML.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to submit, for example v0.2.18. Defaults to the current source version.'
        required: false
        type: string
      draft_only:
        description: 'Create or update the submission but do not send it for certification.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: store-submission
  cancel-in-progress: false

jobs:
  submit:
    runs-on: windows-latest        # makeappx and the MSIX toolchain are Windows only
    timeout-minutes: 120           # the package is ~650 MB to build and upload

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      # Before the build, not after it. Without this the first run on an unconfigured repository
      # spends twenty minutes packaging 1.3 GB and then dies on an opaque msstore auth error.
      - name: Verify Partner Center credentials are configured
        shell: pwsh
        env:
          STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
          STORE_SELLER_ID: ${{ secrets.STORE_SELLER_ID }}
          STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
          STORE_PRODUCT_ID: ${{ secrets.STORE_PRODUCT_ID }}
        run: |
          $missing = @('STORE_TENANT_ID','STORE_SELLER_ID','STORE_CLIENT_ID','STORE_CLIENT_SECRET','STORE_PRODUCT_ID') |
              Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing) {
              throw "Missing repository secret(s): $($missing -join ', '). " +
                  'The first four come from an Entra app registration associated with the Partner ' +
                  'Center account (Account settings > Users); STORE_PRODUCT_ID is the 12-character ' +
                  'Store ID from Product management > Product identity. See ' +
                  'docs/microsoft-store-submission.md.'
          }
          Write-Host 'All five Partner Center secrets are present.'

      - name: Resolve version
        shell: pwsh
        run: |
          $props = [xml](Get-Content Directory.Build.props)
          $version = [string]$props.Project.PropertyGroup.VersionPrefix
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Could not read VersionPrefix.' }
          if ($env:INPUT_TAG -and $env:INPUT_TAG -ne "v$version") {
              throw "Tag $env:INPUT_TAG does not match source version v$version."
          }
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
        env:
          INPUT_TAG: ${{ inputs.tag }}

      - name: Download offline speech models
        shell: pwsh
        run: ./scripts/Download-Models.ps1

      - name: Run regression tests
        shell: pwsh
        run: dotnet test tests/Scribe.Core.Tests/Scribe.Core.Tests.csproj -c Release

      # Builds the same package we ship by hand, so the automated and manual paths cannot drift.
      # The Store re-signs after certification, so this stays unsigned deliberately.
      - name: Build MSIX
        shell: pwsh
        run: ./build/pack-msix.ps1

      - name: Verify the package
        shell: pwsh
        run: |
          # One bundle carries both architectures, so a single submission serves Intel/AMD and
          # Arm64 devices and Windows installs only the matching payload.
          $bundle = "releases/Scribe-$env:VERSION.msixbundle"
          if (-not (Test-Path $bundle)) { throw "Expected $bundle." }
          $size = [math]::Round((Get-Item $bundle).Length / 1MB, 1)
          Write-Host "Submitting $bundle ($size MB)"

          foreach ($runtime in 'win-x64', 'win-arm64') {
              $stage = "publish/msix-stage-$runtime/AppxManifest.xml"
              if (-not (Test-Path $stage)) { throw "Expected staged manifest $stage." }
              # The Store reserves the fourth version field; a non-zero value is rejected at ingestion.
              $manifest = [xml](Get-Content $stage)
              $packageVersion = $manifest.Package.Identity.Version
              if ($packageVersion -ne "$env:VERSION.0") {
                  throw "Manifest version $packageVersion for $runtime does not match $env:VERSION.0."
              }
              $architecture = $manifest.Package.Identity.ProcessorArchitecture
              $expected = if ($runtime -eq 'win-arm64') { 'arm64' } else { 'x64' }
              if ($architecture -ne $expected) {
                  throw "Manifest for $runtime declares ProcessorArchitecture '$architecture', expected '$expected'."
              }
          }
          # Absolute. msstore resolves this argument itself rather than treating it as relative to
          # the working directory, and Microsoft's own GitHub Actions example passes a full path.
          $full = (Resolve-Path $bundle).Path
          "MSIX_PATH=$full" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      # Pinned, not `latest`. msstore CLI v0.4.0 regressed the upload progress callback: it reads
      # the FileStream length from a thread pool callback after the stream is disposed, throws
      # ObjectDisposedException, and reports "Error while uploading the application package" right
      # as the Azure blob upload reaches 0%. That is exactly the failure this repository hit on its
      # first real submission. v0.3.9 is the last version without it.
      # https://github.com/microsoft/msstore-cli/issues/154
      #
      # Worth re-testing `latest` once the fix in msstore-cli#155 ships, because a pin left in
      # place forever eventually becomes its own bug.
      - name: Set up Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@v1.4
        with:
          version: v0.3.9

      - name: Configure Partner Center credentials
        shell: pwsh
        run: |
          msstore reconfigure `
              --tenantId "${{ secrets.STORE_TENANT_ID }}" `
              --sellerId "${{ secrets.STORE_SELLER_ID }}" `
              --clientId "${{ secrets.STORE_CLIENT_ID }}" `
              --clientSecret "${{ secrets.STORE_CLIENT_SECRET }}"

      # Printed before the attempt, because the failure it explains is otherwise cryptic. The
      # Ingestion API refuses to touch a submission that was created in the Partner Center
      # dashboard, and the message it returns does not say which submission it means or that a
      # human has to go and delete it.
      - name: Report the current submission state
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host 'Submission status before publishing:'
          msstore submission status "${{ secrets.STORE_PRODUCT_ID }}"
          $global:LASTEXITCODE = 0

      - name: Submit to the Microsoft Store
        shell: pwsh
        run: |
          # Built as an array. A bare $noCommit holding '' would be passed to msstore as an
          # empty argument rather than omitted, which is a parse error, not a no-op.
          $publishArgs = @('publish', $env:MSIX_PATH, '-id', '${{ secrets.STORE_PRODUCT_ID }}')

          # -nc creates or updates the draft without committing it for certification.
          if ($env:DRAFT_ONLY -eq 'true') { $publishArgs += '-nc' }

          # NOT assigned to a variable. `$x = cmd | Tee-Object -Variable y` sends the pipeline to
          # $x and prints nothing, which is how the first failure here showed a bare exit code and
          # no message. Unassigned, Tee-Object both prints and captures.
          Write-Host "Running: msstore $($publishArgs -join ' ')"
          msstore @publishArgs 2>&1 | Tee-Object -Variable captured
          $exit = $LASTEXITCODE
          Write-Host "msstore exited with $exit."

          if ($exit -ne 0) {
              $text = ($captured | Out-String)

              # The first-run failure, every time. The product has a submission that was created in
              # the Partner Center dashboard, and the API is not allowed to update, delete or commit
              # it. Only a human can clear it, so say exactly that instead of an exit code.
              if ($text -match 'created\s+through the API') {
                  # An array joined at the end, NOT a PowerShell here-string. A here-string has to
                  # be closed at column 0, which is impossible inside a YAML block scalar.
                  $guidance = @(
                      'This product has an in-progress submission that was created in the Partner'
                      'Center dashboard, and the Store Ingestion API is not allowed to modify or'
                      'delete it.'
                      ''
                      'To fix, in Partner Center:'
                      '  1. Open the app > Submissions and find the submission that is in progress'
                      '     (draft, or in certification). The PUBLISHED version is unaffected.'
                      '  2. Delete or discard that in-progress submission.'
                      '  3. Re-run this workflow. The API then creates the submission itself and'
                      '     can manage it from then on.'
                      ''
                      'After that, manage submissions through this workflow only. Editing an'
                      'API-created submission in Partner Center puts it back into this same state.'
                  )
                  throw ($guidance -join [Environment]::NewLine)
              }

              throw "msstore publish failed with exit code $exit."
          }
        env:
          DRAFT_ONLY: ${{ inputs.draft_only }}
