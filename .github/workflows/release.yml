name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write        # needed to hand off to the Store submission workflow; see the last step

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ github.token }}

      # Hoisted here because `secrets` is NOT one of the contexts available to an `if:`
      # expression. Testing secrets.* directly in a step condition does not fail that step, it
      # invalidates the whole workflow file: GitHub rejects the run before scheduling any job, so
      # every push since that condition was added produced a red run with zero jobs and the
      # unhelpful message "This run likely failed because of a workflow file issue". `env` does
      # allow the secrets context, so the presence check happens here and the steps test the result.
      STORE_SECRETS_PRESENT: ${{ secrets.STORE_CLIENT_ID != '' && secrets.STORE_PRODUCT_ID != '' }}

    steps:
      - name: Check out release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Validate release context
        shell: pwsh
        run: |
          $props = [xml](Get-Content Directory.Build.props)
          $version = [string]$props.Project.PropertyGroup.VersionPrefix
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
              throw "Tag $env:GITHUB_REF_NAME does not match source version v$version."
          }
          git fetch origin main --no-tags
          $head = git rev-parse HEAD
          $main = git rev-parse origin/main
          if ($head -ne $main) { throw "Release commit $head is not current origin/main $main." }
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download offline speech models
        shell: pwsh
        run: ./scripts/Download-Models.ps1

      - name: Run regression tests
        shell: pwsh
        run: dotnet test tests/Scribe.Core.Tests/Scribe.Core.Tests.csproj -c Release

      - name: Seed previous release for delta packaging
        shell: pwsh
        run: |
          $releases = gh release list `
              --repo "${{ github.repository }}" `
              --limit 20 `
              --json tagName,isDraft,isPrerelease | ConvertFrom-Json
          $previous = $releases |
              Where-Object {
                  -not $_.isDraft -and
                  -not $_.isPrerelease -and
                  $_.tagName -ne "v$env:VERSION"
              } |
              Select-Object -First 1
          if ($null -eq $previous) {
              Write-Host 'No previous stable release is available; a delta package is not expected.'
              return
          }

          New-Item -ItemType Directory -Path releases -Force | Out-Null
          # Per channel, because each architecture builds its delta against its own history. A
          # channel with no prior full package packs as a full release instead, which is the
          # expected path the first time an architecture ships.
          #
          # Only that specific case is tolerated: an auth, network or API failure must still fail
          # the job rather than silently shipping without a delta, so the miss is confirmed by
          # asking whether the asset actually exists before swallowing the error.
          foreach ($channel in 'win-x64', 'win-arm64') {
              gh release download $previous.tagName `
                  --repo "${{ github.repository }}" `
                  --pattern "Scribe-*-$channel-full.nupkg" `
                  --dir releases
              if ($LASTEXITCODE -ne 0) {
                  $global:LASTEXITCODE = 0
                  $assets = gh release view $previous.tagName `
                      --repo "${{ github.repository }}" `
                      --json assets --jq '.assets[].name' 2>$null
                  if ($LASTEXITCODE -ne 0) {
                      throw "Could not inspect release $($previous.tagName) to confirm why the $channel download failed."
                  }
                  if ($assets -match "-$channel-full\.nupkg$") {
                      throw "The $channel full package exists in $($previous.tagName) but could not be downloaded."
                  }
                  Write-Host "No $channel package in $($previous.tagName); it will pack as a full release."
              }
          }

      - name: Build release artifacts
        shell: pwsh
        run: ./build/pack.ps1 -Architecture all

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $token = $env:GITHUB_TOKEN
          # One release, one tag, one channel upload per architecture. --merge lets the second
          # upload attach to the release the first one created instead of failing on a conflict.
          #
          # A channel already present is not an error. AGENTS.md documents publishing by hand when
          # hosted runners are unavailable, and that path pushes the same tag, which starts this
          # job. vpk cannot merge an existing releases.<channel>.json and fails hard, so the tag of
          # a perfectly good manual release would be marked failed. Checking first keeps the two
          # documented paths compatible, and still uploads a channel the manual run missed.
          foreach ($channel in 'win-x64', 'win-arm64') {
              $manifest = "releases.$channel.json"
              $existing = gh release view "v$env:VERSION" --repo "${{ github.repository }}" `
                  --json assets --jq ".assets[] | select(.name == `"$manifest`") | .name" 2>$null
              $global:LASTEXITCODE = 0

              if ($existing) {
                  Write-Host "::notice::$channel is already published on v$env:VERSION; leaving it as is."
                  continue
              }

              vpk upload github `
                  --repoUrl "https://github.com/${{ github.repository }}" `
                  --publish `
                  --releaseName "Scribe $env:VERSION" `
                  --tag "v$env:VERSION" `
                  --targetCommitish "${{ github.sha }}" `
                  --token $token `
                  --outputDir releases `
                  --channel $channel `
                  --merge
              if ($LASTEXITCODE -ne 0) { throw "vpk upload failed for $channel." }
          }
        env:
          GH_TOKEN: ${{ github.token }}

      # Hands the same tag to the Store workflow so a release ships to both channels from one
      # push, instead of the Store half waiting on somebody remembering to click it.
      #
      # A workflow_dispatch, not an `on: release` trigger in store.yml. The release above is
      # created with GITHUB_TOKEN, and events raised by GITHUB_TOKEN deliberately do not start new
      # workflow runs; workflow_dispatch and repository_dispatch are the two documented exceptions.
      # An `on: release` trigger would look correct and simply never fire.
      # https://docs.github.com/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow
      - name: Submit to the Microsoft Store
        if: |
          startsWith(github.ref, 'refs/tags/v') &&
          vars.STORE_AUTO_SUBMIT != 'false' &&
          env.STORE_SECRETS_PRESENT == 'true'
        shell: pwsh
        run: |
          # Fire and forget. A Store certification cycle takes hours, so blocking this job on it
          # would only make the release look stuck; the Store run reports itself.
          gh workflow run store.yml `
              --repo "${{ github.repository }}" `
              --ref main `
              -f tag="v$env:VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Could not start the Store submission workflow.' }
          Write-Host "::notice::Store submission dispatched for v$env:VERSION."
        env:
          GH_TOKEN: ${{ github.token }}

      # Says so loudly rather than silently skipping, because "I thought that was automated" is
      # exactly how a Store release gets missed for a week.
      - name: Note that the Store submission was skipped
        if: |
          startsWith(github.ref, 'refs/tags/v') &&
          (vars.STORE_AUTO_SUBMIT == 'false' || env.STORE_SECRETS_PRESENT != 'true')
        shell: pwsh
        run: |
          $reason = if ('${{ vars.STORE_AUTO_SUBMIT }}' -eq 'false') {
              'the STORE_AUTO_SUBMIT repository variable is set to false'
          } else {
              'the Partner Center secrets are not configured on this repository'
          }
          Write-Host "::warning::No Store submission was made for v$env:VERSION because $reason. " +
              "The GitHub release is published; the Store still needs a manual upload."

      - name: Upload release artifacts for manual run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scribe-${{ env.VERSION }}
          path: |
            releases/releases.win-x64.json
            releases/releases.win-arm64.json
            releases/Scribe-${{ env.VERSION }}-win-x64-full.nupkg
            releases/Scribe-${{ env.VERSION }}-win-x64-delta.nupkg
            releases/Scribe-${{ env.VERSION }}-win-arm64-full.nupkg
            releases/Scribe-${{ env.VERSION }}-win-arm64-delta.nupkg
            releases/Scribe-win-x64-Portable.zip
            releases/Scribe-win-x64-Setup.exe
            releases/Scribe-win-arm64-Portable.zip
            releases/Scribe-win-arm64-Setup.exe
          if-no-files-found: error
          retention-days: 7
