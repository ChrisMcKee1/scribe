name: macOS

# The native macOS port (macos/Scribe) is a separate Swift package with no shared code with the
# Windows build, so it gets its own workflow. GitHub's arm64 macOS runners can build it, run its
# XCTest suites (the unit tests, and the headless scenarios on the committed speech fixtures) and
# the sanitizers, and lint it. They cannot grant microphone, accessibility or input-monitoring
# consent, so anything behind those permissions (the event tap, capture from a real microphone,
# paste, the menu bar and overlay UI) still needs a real Mac.

on:
  push:
    branches: ['macos/**']
    paths:
      - 'macos/**'
      - 'tests/fixtures/speech/**'
      - '.github/workflows/macos.yml'
  pull_request:
    branches: [main]
    paths:
      - 'macos/**'
      - 'tests/fixtures/speech/**'
      - '.github/workflows/macos.yml'
  workflow_dispatch:
    inputs:
      real_asr:
        description: >-
          Also run the optional real speech recognition job: it installs Foundry Local and its speech model and
          transcribes the committed fixtures. Optional and never required; a hosted runner may not fit the model.
        type: boolean
        default: false
permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

# An explicit bash runs every step with -o pipefail, so a build or a test run piped through tee
# still fails its step when the build or a test fails.
defaults:
  run:
    shell: bash

jobs:
  build-test:
    name: build and test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build (debug)
        run: swift build --package-path macos/Scribe 2>&1 | tee build-debug.log

      - name: Build (release)
        run: swift build --package-path macos/Scribe -c release 2>&1 | tee build-release.log

      # Each test runs in a worker process of its own. Every suite keeps its state to itself (a
      # defaults suite, Keychain service, temporary directory and pasteboard of its own), so no
      # worker can see another's settings or secrets.
      - name: Unit and scenario tests
        env:
          SCRIBE_SCENARIO_REPORT_DIR: ${{ runner.temp }}/scenario-reports
        run: |
          swift test --package-path macos/Scribe --parallel --xunit-output "$RUNNER_TEMP/xunit.xml" 2>&1 \
            | tee test.log

      - name: Count compiler warnings
        if: always()
        run: |
          for log in build-debug.log build-release.log test.log; do
            [ -f "$log" ] || continue
            count=$(grep -cE '\.swift:[0-9]+:[0-9]+: warning:' "$log" || true)
            echo "$log: $count compiler warning line(s)"
            grep -E '\.swift:[0-9]+:[0-9]+: warning:' "$log" | sort -u | head -n 50 || true
          done

      # A parallel run prints only the output of failing tests, so the scenarios' measurements go to
      # files, which this prints and the next step uploads.
      - name: Test count and scenario reports
        if: always()
        run: |
          xunit="$RUNNER_TEMP/xunit.xml"
          reports="$RUNNER_TEMP/scenario-reports"
          tests=$(grep -oE '<testcase ' "$xunit" 2>/dev/null | wc -l | tr -d ' ' || true)
          failures=$(grep -oE '<failure' "$xunit" 2>/dev/null | wc -l | tr -d ' ' || true)
          echo "Tests run: ${tests:-0}, failed: ${failures:-0}"
          {
            echo "### Tests on ${{ matrix.runner }}"
            echo "Tests run: ${tests:-0}, failed: ${failures:-0}"
            if ls "$reports"/*.txt >/dev/null 2>&1; then
              echo '```text'
              cat "$reports"/*.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if ls "$reports"/*.txt >/dev/null 2>&1; then
            cat "$reports"/*.txt
          fi

      - name: Upload the scenario reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scenario-reports-${{ matrix.runner }}
          path: ${{ runner.temp }}/scenario-reports
          if-no-files-found: ignore

  sanitizers:
    name: tests under ${{ matrix.sanitizer }} sanitizer
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [thread, address]
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Unit and scenario tests with the ${{ matrix.sanitizer }} sanitizer
        env:
          SCRIBE_SCENARIO_REPORT_DIR: ${{ runner.temp }}/scenario-reports
        run: |
          swift test --package-path macos/Scribe --parallel --sanitize=${{ matrix.sanitizer }} \
            --xunit-output "$RUNNER_TEMP/xunit.xml" 2>&1 | tee test.log

      - name: Test count and scenario reports
        if: always()
        run: |
          xunit="$RUNNER_TEMP/xunit.xml"
          reports="$RUNNER_TEMP/scenario-reports"
          tests=$(grep -oE '<testcase ' "$xunit" 2>/dev/null | wc -l | tr -d ' ' || true)
          failures=$(grep -oE '<failure' "$xunit" 2>/dev/null | wc -l | tr -d ' ' || true)
          echo "Tests run: ${tests:-0}, failed: ${failures:-0}"
          {
            echo "### Tests under the ${{ matrix.sanitizer }} sanitizer"
            echo "Tests run: ${tests:-0}, failed: ${failures:-0}"
            if ls "$reports"/*.txt >/dev/null 2>&1; then
              echo '```text'
              cat "$reports"/*.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if ls "$reports"/*.txt >/dev/null 2>&1; then
            cat "$reports"/*.txt
          fi

      - name: Upload the scenario reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scenario-reports-${{ matrix.sanitizer }}-sanitizer
          path: ${{ runner.temp }}/scenario-reports
          if-no-files-found: ignore

  style:
    name: style
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # The repository bans U+2014 and U+2013 everywhere (AGENTS.md, Code style).
      - name: No em or en dashes under macos/
        run: |
          if LC_ALL=C grep -rnIE $'\xe2\x80[\x93\x94]' macos/; then
            echo "::error::Found an em or en dash under macos/. Rewrite with a comma, colon, period or 'to'."
            exit 1
          fi

      - name: swift format lint
        if: always()
        run: |
          config=macos/Scribe/.swift-format
          if [ -f "$config" ]; then
            swift format lint --strict --recursive --configuration "$config" macos/Scribe/Sources macos/Scribe/Tests
          else
            echo "No macos/Scribe/.swift-format yet; reporting against the default style only."
            swift format lint --recursive macos/Scribe/Sources macos/Scribe/Tests 2>&1 | tee lint.log || true
            echo "$(grep -c 'warning:' lint.log || true) lint warning(s)"
          fi

  # Optional and never required: it runs only when the workflow is dispatched by hand with real_asr,
  # and its failure never fails the run. It installs Foundry Local with Homebrew, keeps the speech
  # model in the Actions cache between runs, and transcribes the committed fixtures through the
  # production TranscriptionEngine (ScribeScenarioTests.RealRecognizerScenarioTests), reporting cold
  # and warm latency, word overlap, peak memory and disk. A 7 GB hosted runner may not fit the model;
  # finding that out is part of what the job is for.
  real-asr:
    name: real speech recognition (optional)
    if: github.event_name == 'workflow_dispatch' && inputs.real_asr
    runs-on: macos-15
    timeout-minutes: 60
    continue-on-error: true
    env:
      SCRIBE_ASR_MODEL: parakeet-tdt-0.6b-v2
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Foundry Local
        run: |
          brew tap microsoft/foundrylocal
          brew install foundrylocal
          foundry --version

      - name: Find Foundry Local's model cache
        id: models
        run: |
          foundry cache location 2>&1 | tee cache-location.txt || true
          path=$(grep -oE '/[^[:space:]]+' cache-location.txt | tail -n 1 || true)
          echo "path=${path:-$HOME/.foundry/cache/models}" >> "$GITHUB_OUTPUT"

      - name: Restore the speech model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.models.outputs.path }}
          key: foundry-local-${{ env.SCRIBE_ASR_MODEL }}-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Download the speech model
        run: foundry model download "$SCRIBE_ASR_MODEL"

      - name: Build the tests
        run: swift build --package-path macos/Scribe --build-tests

      - name: Transcribe the fixtures
        env:
          SCRIBE_REAL_ASR: '1'
          SCRIBE_SCENARIO_REPORT_DIR: ${{ runner.temp }}/asr-report
        run: |
          # Foundry Local may do the work in a service of its own rather than in a child of the test,
          # so every Foundry Local process is sampled, once a second, until the tests end.
          peakFile="$RUNNER_TEMP/peak-rss-kb"
          echo 0 > "$peakFile"
          (
            peak=0
            while true; do
              rss=$(ps -axo rss=,command= | awk 'tolower($0) ~ /foundry/ && !/awk/ { sum += $1 } END { print sum + 0 }')
              if [ "$rss" -gt "$peak" ]; then
                peak=$rss
                echo "$peak" > "$peakFile"
              fi
              sleep 1
            done
          ) &
          sampler=$!
          status=0
          swift test --package-path macos/Scribe --skip-build \
            --filter 'ScribeScenarioTests.RealRecognizerScenarioTests' || status=$?
          kill "$sampler" 2>/dev/null || true
          echo "Peak resident memory of Foundry Local's processes: $(( $(cat "$peakFile") / 1024 )) MB"
          exit "$status"

      - name: Report
        if: always()
        run: |
          peak=$(cat "$RUNNER_TEMP/peak-rss-kb" 2>/dev/null || echo 0)
          cache=$(du -sh "${{ steps.models.outputs.path }}" 2>/dev/null | cut -f1 || echo unknown)
          {
            echo "### Real speech recognition (optional)"
            echo "Model: $SCRIBE_ASR_MODEL, cached at ${{ steps.models.outputs.path }} ($cache)"
            echo "Peak resident memory of Foundry Local's processes: $(( peak / 1024 )) MB"
            echo '```text'
            df -h / || true
            cat "$RUNNER_TEMP"/asr-report/*.txt 2>/dev/null || echo "No report was written."
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"